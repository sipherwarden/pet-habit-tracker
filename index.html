<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>HabitPet DX</title>
  <style>
    :root {
      --bg: #fffbf5;
      --card-bg: #ffffff;
      --primary: #ff7597;
      --primary-hover: #ff527d;
      --accent: #ffb703;
      --text: #2d3142;
      --text-muted: #8d99ae;
      --border: #f0e6e8;
      --success: #38b000;
      --radius: 24px;
      --shadow: 0 10px 30px rgba(160, 140, 150, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 16px 16px 40px;
      min-height: 100vh;
      transition: background 0.4s ease;
    }

    /* Environment Themes */
    body.theme-room { background: #fff8f0; }
    body.theme-meadow { background: #f0fdf4; }
    body.theme-night { background: #0f172a; color: #f8fafc; }
    body.theme-night .pet-card, body.theme-night .habits-container, body.theme-night .top-bar {
      background: #1e293b;
      color: #f8fafc;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    body.theme-night .habit-item { background: #334155; border-color: #475569; color: #f8fafc; }
    body.theme-night .pet-speech { color: #94a3b8; }
    body.theme-night .stat-bar-outer { background: #334155; }

    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 12px 18px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .brand {
      font-weight: 800;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .points-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff8e6;
      color: #b7791f;
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 1rem;
      border: 1.5px solid #fef08a;
      transition: transform 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    .points-badge.bump {
      transform: scale(1.15);
    }

    .theme-toggle-btn {
      background: none;
      border: 1px solid var(--border);
      font-size: 1.1rem;
      padding: 6px 10px;
      border-radius: 12px;
      cursor: pointer;
    }

    /* Pet Stage */
    .pet-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 22px 18px;
      text-align: center;
      box-shadow: var(--shadow);
      position: relative;
    }

    .stage-canvas {
      position: relative;
      width: 170px;
      height: 170px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,182,193,0.25) 0%, rgba(255,255,255,0) 70%);
      cursor: pointer;
    }

    .pet-avatar {
      font-size: 80px;
      user-select: none;
      display: inline-block;
      transform-origin: bottom center;
      animation: idle-float 3s infinite ease-in-out;
      transition: transform 0.15s ease;
    }

    .pet-avatar.bounce {
      animation: squish 0.35s ease;
    }

    @keyframes idle-float {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      50% { transform: translateY(-7px) scale(1.02, 0.98); }
    }

    @keyframes squish {
      0% { transform: scale(1, 1); }
      30% { transform: scale(1.25, 0.75); }
      60% { transform: scale(0.85, 1.15) translateY(-14px); }
      100% { transform: scale(1, 1); }
    }

    .hat-layer {
      position: absolute;
      top: 14px;
      font-size: 34px;
      pointer-events: none;
      z-index: 2;
    }

    .pet-name-tag {
      font-size: 1.35rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .lvl-badge {
      font-size: 0.75rem;
      background: #ffe3ec;
      color: #d6336c;
      padding: 3px 8px;
      border-radius: 8px;
      font-weight: 800;
    }

    .pet-speech {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 6px;
      min-height: 22px;
      font-style: italic;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 14px;
      margin-top: 16px;
      text-align: left;
    }

    .stat-box {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .stat-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .stat-bar-outer {
      height: 9px;
      background: #f1f3f5;
      border-radius: 999px;
      overflow: hidden;
    }

    .stat-bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .fill-hunger { background: linear-gradient(90deg, #ff922b, #ffa94d); }
    .fill-happy { background: linear-gradient(90deg, #ff6b81, #ff8787); }
    .fill-clean { background: linear-gradient(90deg, #4dabf7, #74c0fc); }
    .fill-energy { background: linear-gradient(90deg, #20c997, #38d9a9); }

    /* Action Buttons */
    .actions-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 16px;
    }

    .action-btn {
      background: #fff0f3;
      border: 1px solid #ffd5df;
      border-radius: 14px;
      padding: 9px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      color: var(--text);
      transition: transform 0.15s, background 0.15s;
    }

    .action-btn:active {
      transform: scale(0.92);
      background: #ffccd5;
    }

    .action-btn .emoji { font-size: 1.35rem; }
    .action-btn .label { font-size: 0.72rem; font-weight: 700; }
    .action-btn .cost { font-size: 0.65rem; color: #c92a2a; font-weight: 800; }

    /* Extra Tabs (Mini-game & Wardrobe) */
    .sub-features {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .sub-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px dashed var(--primary);
      background: #fff5f7;
      color: #d6336c;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Habits Box */
    .habits-container {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px 18px;
      box-shadow: var(--shadow);
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .quick-tags {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .tag-btn {
      background: #f1f3f5;
      border: none;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      color: var(--text);
    }

    .habit-input-form {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .habit-input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 0.9rem;
      outline: none;
      background: transparent;
      color: inherit;
    }

    .reward-select {
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 0 6px;
      background: transparent;
      font-size: 0.8rem;
      font-weight: 700;
      color: inherit;
    }

    .btn-add {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      font-weight: 800;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .habit-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .habit-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
